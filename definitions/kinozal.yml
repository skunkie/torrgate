  modes:
    search: [q]
    tv-search: [q]
    movie-search: [q]

details:
  path: "details.php?id={{ .Id }}"

login:
  path: takelogin.php
  method: post
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  error:
    - selector: div.error
  test:
    path: index.php
    selector: a[href="userdetails.php"]

search:
  paths:
    - path: browse.php
      inputs:
        s: "{{ .Keywords }}"
        c: "{{ if .Query.Category }}{{ .Query.Category }}{{ else }}0{{ end }}"
        v: "{{ if .Query.Year }}{{ .Query.Year }}{{ else }}0{{ end }}"
  rows:
    selector: "tr.bg, table.t_peer tbody tr:has(td.nam)"
  fields:
    title:
      selector: "td.nam a"
    details:
      selector: "td.nam a"
      attribute: href
    download:
      selector: "td.down a, td.nam a"
      attribute: href
      filters:
        - name: replace
          args: ["details.php?id=", "download.php?id="]
    size:
      selector: "td.s:nth-child(3), td.s"
    seeders:
      selector: "td.sl"
    leechers:
      selector: "td.sr, td.zr"
    date:
      selector: "td.s:nth-child(4), td:last-child"
      filters:
        - name: dateparse
