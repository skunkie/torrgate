  inputs:
    $raw: '{{ if .Categories }}f={{ join .Categories "," }}{{ end }}{{ if .Config.uploader }}&pn={{ .Config.uploader }}{{ end }}'
    nm: "{{ .Keywords }}"
  keywordsfilters:
    - name: re_replace
      args: ["[^a-zA-Zа-яА-ЯёЁ0-9]+", "%"]
    - name: re_replace
      args: ["(?i)\\bS0*(\\d+)E0*(\\d+)\\b", "ТВ | Сезон: $1 Серии: $2"]
    - name: re_replace
      args: ["(?i)\\bS0*(\\d+)\\b", "ТВ | Сезон: $1"]
  rows:
    selector: "table#tor-tbl > tbody > tr:has(td.tor-size > a.tr-dl)"
  fields:
    category:
      selector: td.f-name-col > div.f-name > a
      attribute: href
      filters:
        - name: querystring
          args: f
    date:
      selector: td:nth-child(10)
      attribute: data-ts_text
      filters:
        - name: dateparse
    details:
      selector: td.t-title-col > div.t-title > a.tLink
      attribute: href
    download:
      selector: td.tor-size > a.tr-dl
      attribute: href
    downloadvolumefactor:
      text: 1
    grabs:
      selector: td:nth-child(9)
    id:
      selector: td.t-title-col > div.t-title > a.tLink
      attribute: href
      filters:
        - name: querystring
          args: t
    leechers:
      selector: td:nth-child(8)
    minimumratio:
      text: 1
    minimumseedtime:
      text: 0
    seeders:
      optional: true
      selector: 'td:nth-child(7):not(:contains("дн")) > b'
    size:
      selector: td.tor-size
      attribute: data-ts_text
    title:
      selector: td.t-title-col > div.t-title > a.tLink
      filters:
        - name: re_replace
          args: ["(?i)\\p{Pd}", "-"]
        - name: re_replace
          args: ["(?i)\\b(2160p), 4K\\b", "$1"]
        - name: re_replace
          args: ["(?i)Сезон\\s*:?\\s*(\\d+).*?(?:Серии|Серия|Эпизод|Выпуски)\\s*:?\\s*(\\d+(?:-\\d+)?)", "S$1E$2"]
        - name: re_replace
          args: ["(?i)Сезон\\s*:?\\s*(\\d+(?:-\\d+)?)", "S$1"]
        - name: re_replace
          args: ["(?i)(\\([\\p{IsCyrillic}\\W]+\\))|(^[\\p{IsCyrillic}\\W\\d]+\\/ )|([\\p{IsCyrillic} \\-]+,+)|([\\p{IsCyrillic}]+)", "{{ if .Config.stripcyrillic }}{{ else }}$1$2$3$4{{ end }}"]
        - name: re_replace
          args: ["(?i)\\bHDTVRip\\b", "HDTV"]
        - name: re_replace
          args: ["(?i)\\bWEB-?DLRip\\b", "WEB-DL"]
        - name: re_replace
          args: ["(?i)\\bWEBDL\\b", "WEB-DL"]
        - name: re_replace
          args: ["[\\[\\(]\\s*[\\)\\]]", ""]
        - name: re_replace
          args: ["^[\\s&,\\.!?+_\\-|/\\\\:]+", ""]
        - name: re_replace
          args: ["\\s+", " "]
        - name: trim
    uploadvolumefactor:
      text: 1
