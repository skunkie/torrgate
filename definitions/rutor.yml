---
id: rutor
site: rutor
name: RuTor
description: "RuTor is a Russian Public Torrent Tracker"
language: ru-RU
type: public
encoding: UTF-8
links:
  - https://rutor.info
  - https://rutor.is

trackers:
  - http://retracker.local/announce
  - udp://opentor.net:6969
  - udp://bt.rutor.info:2710
  - udp://bt.rutor.is:2710

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Movies"}
    - {id: 2, cat: TV, desc: "TV"}
    - {id: 3, cat: Other, desc: "Other"}
  modes:
    search: [q]
    tv-search: [q]
    movie-search: [q]

details:
  path: "torrent/{{ .Id }}"

search:
  paths:
    - path: "{{ if .Keywords }}search/{{ .Page }}/{{ .Category }}/100/0/{{ .Keywords }}{{ else }}browse/{{ .Page }}/{{ .Category }}/0/0{{ end }}"
      method: get
      response:
        type: html

  rows:
    selector: tr:has(td:has(a[href^="magnet:?xt="]))

  fields:
    id:
      selector: "a[href^='/torrent/']"
      attribute: href
      filters:
        - name: re_replace
          args: ["/torrent/(\\d+).*", "$1"]
    title:
      selector: td:nth-of-type(2) a[href^="/torrent/"]
    details:
      selector: td:nth-of-type(2) a[href^="/torrent/"]
      attribute: href
    download:
      selector: "a.downgif, a[href^='https://d.rutor'], a[href^='//d.rutor']"
      attribute: href
    magnet:
      selector: "a[href^='magnet:?xt=']"
      attribute: href
    size:
      selector: "td:nth-last-child(2)"
    seeders:
      selector: ".green"
    leechers:
      selector: ".red"
    date:
      selector: "td:first-child"
      filters:
        - name: dateparse
