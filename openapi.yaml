            example: 2024
        - name: rid
          in: query
          required: false
          description: TVRage id, passed to definitions as .Query.TVRageID; with rid in the indexer tv-search caps, an otherwise unsupported search mode is still answered. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: tvdbid
          in: query
          required: false
          description: TVDB id, passed to definitions as .Query.TVDBID; with tvdbid in the indexer tv-search caps, an otherwise unsupported search mode is still answered. A TV search returns error 203 when the indexer has no TV search. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: tvmazeid
          in: query
          required: false
          description: TVmaze id, passed to definitions as .Query.TVMazeID. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: tmdbid
          in: query
          required: false
          description: TMDB id, passed to definitions as .Query.TMDBID. A movie or TV search returns error 203 unless tmdbid is in that mode's indexer caps. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: traktid
          in: query
          required: false
          description: Trakt id, passed to definitions as .Query.TraktID. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: doubanid
          in: query
          required: false
          description: Douban id, passed to definitions as .Query.DoubanID. A value that is not an integer returns error 201.
          schema:
            type: integer
            format: int32
        - name: album
          in: query
          required: false
          description: Music album, passed to definitions as .Query.Album; a blank value is ignored.
          schema:
            type: string
        - name: artist
          in: query
          required: false
          description: Music artist, passed to definitions as .Query.Artist; a blank value is ignored.
          schema:
            type: string
        - name: label
          in: query
          required: false
          description: Music label, passed to definitions as .Query.Label; a blank value is ignored.
          schema:
            type: string
        - name: track
          in: query
          required: false
          description: Music track, passed to definitions as .Query.Track; a blank value is ignored.
          schema:
            type: string
        - name: genre
          in: query
          required: false
          description: Genre, passed to definitions as .Query.Genre; a blank value is ignored.
          schema:
            type: string
        - name: title
          in: query
          required: false
          description: Book title, passed to definitions as .Query.Title; a blank value is ignored.
          schema:
            type: string
        - name: author
          in: query
          required: false
          description: Book author, passed to definitions as .Query.Author; a blank value is ignored.
          schema:
            type: string
        - name: publisher
          in: query
          required: false
          description: Book publisher. As in Jackett, it is passed to definitions as .Query.Author, replacing author; a blank value is ignored.
          schema:
            type: string
        - name: cat
          in: query
          required: false
          description: Torznab category IDs from caps, comma-separated. A parent (5000) matches its subcategories. With no categories the search is unfiltered; otherwise each indexer requires at least one advertised requested ID or returns an empty feed. Torznab all first checks combined caps, which exclude tracker-specific IDs. Single indexers accept their advertised tracker-specific IDs, including 100000 + ID for described numeric tracker categories. Raw tracker forum IDs are unsupported; mixed requests retain their original IDs. Only the first cat value is read; order and duplicates are preserved, blank entries are skipped, and any other entry that is not an integer returns error 201. A movie search with imdbid and no categories searches Movies (2000).
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: As in Jackett, indexers answer from their first page only, so a value above 0 returns an empty feed. Coerced from digits and numeric separators (-5 reads as 5 and 1.5 as 15); a value beyond 32 bits returns error 201
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return; absent or 0 returns every result. Coerced from digits and numeric separators (-5 reads as 5 and 1.5 as 15); a value beyond 32 bits returns error 201
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: Torznab RSS search feed, caps document, or aggregate indexer discovery list; caps and discovery use Cache-Control no-store
          content:
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/TorznabError"
        "401":
          $ref: "#/components/responses/TorznabError"
        "404":
          $ref: "#/components/responses/TorznabError"
        "429":
          $ref: "#/components/responses/TorznabError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/TorznabError"

components:
  responses:
    BadGateway:
      description: Bad gateway error when upstream tracker fails
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Target download host is not an allowed mirror of the indexer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many failed API key attempts from this client; retry after the one-minute window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TorznabError:
      description: "Torznab error document: code 100 for a missing or wrong API key, 201 for an invalid parameter, unknown or unconfigured indexer, or search the indexer caps cannot handle, 203 for unsupported TV IMDb, movie/TV TMDB, or TVDB searches, or t=indexers on a configured single indexer, 500 while the client is blocked after repeated wrong keys, and 900 when a single indexer could not be searched (all leaves failed indexers out instead)"
      content:
        application/xml:
          schema:
            type: string
          example: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <error code="201" description="Indexer &apos;unknown&apos; not found" />
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CategoryMapping:
      type: object
      description: Tracker category mapping for inspection; search category IDs are advertised in t=caps
      required:
        - id
        - name
      properties:
        id:
          type: number
          description: Numeric tracker ID, or the mapped standard category ID for a named tracker category
          example: 1
        name:
          type: string
          example: "Movies"

    ErrorResponse:
      type: object
      description: Standard API error structure
      required:
        - error
        - message
        - statusCode
        - success
      properties:
        error:
          type: string
          example: "NotFound"
        message:
          type: string
          example: "Indexer 'unknown' not found"
        statusCode:
          type: integer
          example: 404
        success:
          type: boolean
          const: false
          example: false

    JackettIndexer:
      type: object
      description: Jackett indexer model
      required:
        - caps
        - configured
        - id
        - links
        - name
        - site_link
        - type
      properties:
        caps:
          type: object
          description: Capabilities configuration
          example:
            CategoryMapping:
              - Cat: "Movies"
                Desc: "Movies"
                ID: 1
            Modes:
              movie-search: ["q"]
              search: ["q"]
              tv-search: ["q"]
        configured:
          type: boolean
          description: Whether login is unnecessary, its emitted template variables have values, or a usable session cookie is available
          example: true
        id:
          type: string
          example: "rutor"
        links:
          type: array
          items:
            type: string
          example: ["https://rutor.info", "https://rutor.is"]
        name:
          type: string
          example: "RuTor"
        site_link:
          type: string
          example: "https://rutor.info"
        type:
          type: string
          enum: [private, public, semi-private]
          example: "public"

    JackettIndexerStatus:
      type: object
      description: Status of an individual indexer in a search response
      required:
        - ElapsedTime
        - Error
        - ID
        - Name
        - Results
        - Status
      properties:
        ElapsedTime:
          type: integer
          description: Search duration in milliseconds; zero when the indexer fails
          example: 45
        Error:
          type: [string, "null"]
          example: null
        ID:
          type: string
          example: "rutor"
        Name:
          type: string
          example: "RuTor"
        Results:
          type: integer
          example: 1
        Status:
          type: integer
          description: "Indexer status (Jackett enum: 0 = Unknown, 1 = Error, 2 = OK)"
          enum: [0, 1, 2]
          example: 2

    JackettResultItem:
      type: object
      description: Individual torrent result item
      required:
        - Album
        - Artist
        - Author
        - BlackholeLink
        - BookTitle
        - Category
        - CategoryDesc
        - Description
        - Details
        - DoubanId
        - DownloadVolumeFactor
        - Files
        - FirstSeen
        - Gain
        - Genres
        - Grabs
        - Guid
        - Imdb
        - InfoHash
        - Label
        - Languages
        - Link
        - MagnetUri
        - MinimumRatio
        - MinimumSeedTime
        - Peers
        - Poster
        - PublishDate
        - Publisher
        - RageID
        - Seeders
        - Size
        - Subs
        - TMDb
        - TVDBId
        - TVMazeId
        - Title
        - Track
        - Tracker
        - TrackerId
        - TrackerType
        - TraktId
        - UploadVolumeFactor
        - Year
      properties:
        Album:
          type:
            - string
            - "null"
        Artist:
          type:
            - string
            - "null"
        Author:
          type:
            - string
            - "null"
        BlackholeLink:
          type:
            - string
            - "null"
          example: null
        BookTitle:
          type:
            - string
            - "null"
        Category:
          type: array
          items:
            type: integer
          example:
            - 2000
            - 100001
        CategoryDesc:
          type: string
          example: Movies
        Description:
          type:
            - string
            - "null"
          description: Release description; an explicitly empty value stays empty, while an absent value is null
          example: null
        Details:
          type: [string, "null"]
          example: https://rutor.info/torrent/300001
        DoubanId:
          type:
            - integer
            - "null"
        DownloadVolumeFactor:
          type:
            - number
            - "null"
          example: 0
        Files:
          type:
            - integer
            - "null"
          example: null
        FirstSeen:
          description: Default DateTime value for interactive search results
          type: string
          example: 0001-01-01T00:00:00
        Gain:
          type:
            - number
            - "null"
          description: Seeders times size in gigabytes without rounding; null when the release has no size or seeders
          example: 697.67578125
        Genres:
          type:
            - array
            - "null"
          items:
            type: string
        Grabs:
          type:
            - integer
            - "null"
          example: 5
        Guid:
          type: string
          description: Release GUID as Jackett assigns it, also emitted as the Torznab item guid; the tracker download link, else the magnet URI, else the details URL
          example: https://d.rutor.info/download/300001
        Imdb:
          type:
            - integer
            - "null"
        InfoHash:
          type:
            - string
            - "null"
          example: 0123456789ABCDEF0123456789ABCDEF01234567
          description: Supplied nonblank info hash, otherwise the magnet xt hash, preserving its case.
        Label:
          type:
            - string
            - "null"
        Languages:
          type: array
          items:
            type: string
          description: Empty in Jackett manual search results.
          maxItems: 0
        Link:
          type:
            - string
            - "null"
          description: Absolute TorrGate download URL with jackett_apikey when an API key is in use; null when the release has no download link.
          example: https://torrgate.example.test/api/v2.0/indexers/rutor/download?url=https%3A%2F%2Fd.rutor.info%2Fdownload%2F300001&jackett_apikey=sample-api-key
        MagnetUri:
          type:
            - string
            - "null"
          example: magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567
        MinimumRatio:
          type:
            - number
            - "null"
          example: 1
        MinimumSeedTime:
          description: Minimum seeding time in seconds; null when not declared
          type:
            - integer
            - "null"
          example: 172800
        Peers:
          type: [integer, "null"]
          example: 15
          description: Leechers, as exposed by Jackett manual search; null when seeders are absent.
        Poster:
          type:
            - string
            - "null"
          format: uri
          example: https://tracker.example.test/posters/sample-release.jpg
        PublishDate:
          type: string
          example: 2026-08-15T12:00:00.000Z
        Publisher:
          type:
            - string
            - "null"
        RageID:
          type:
            - integer
            - "null"
        Seeders:
          type: [integer, "null"]
          example: 320
        Size:
          type:
            - integer
            - "null"
          description: Size in bytes; null when the indexer's definition gives the release no size
          example: 2341011456
        Subs:
          type: array
          items:
            type: string
          description: Empty in Jackett manual search results.
          maxItems: 0
        TMDb:
          type:
            - integer
            - "null"
        TVDBId:
          type:
            - integer
            - "null"
        TVMazeId:
          type:
            - integer
            - "null"
        Title:
          type: string
          example: Example Release (2026) BDRip
        Track:
          type:
            - string
            - "null"
        Tracker:
          type: string
          example: RuTor
        TrackerId:
          type: string
          example: rutor
        TrackerType:
          type: string
          enum:
            - private
            - public
            - semi-private
          example: public
        TraktId:
          type:
            - integer
            - "null"
        UploadVolumeFactor:
          type:
            - number
            - "null"
          example: 1
        Year:
          type:
            - integer
            - "null"

    JackettSearchResponse:
      type: object
      description: Jackett search response envelope
      required:
        - Indexers
        - Results
      properties:
        Indexers:
          type: array
          items:
            $ref: "#/components/schemas/JackettIndexerStatus"
        Results:
          type: array
          items:
            $ref: "#/components/schemas/JackettResultItem"

    MagnetResponse:
      type: object
      description: Magnet URI built from a tracker's .torrent file
      required:
        - InfoHash
        - MagnetUri
      properties:
        InfoHash:
          type: string
          description: Uppercase hex SHA-1 v1 info hash
          example: "0123456789ABCDEF0123456789ABCDEF01234567"
        MagnetUri:
          type: string
          example: "magnet:?xt=urn:btih:0123456789ABCDEF0123456789ABCDEF01234567&dn=Example%20Release&tr=http%3A%2F%2Ftracker.example.org%2Fannounce"

    ProviderStatusMap:
      type: object
      description: Connectivity status for providers keyed by provider name
      additionalProperties:
        type: boolean
      example:
        Kinozal: true
        NoNaMe Club: true
        RuTor: true
        RuTracker.RU: true

    TopicDetails:
      type: object
      description: Detailed metadata for a torrent topic
      required:
        - actors
        - audioTranslation
        - category
        - description
        - director
        - duration
        - id
        - imdbUrl
        - infoHash
        - kinopoiskUrl
        - magnetUri
        - name
        - posterUrl
        - releaseCountry
        - torrentUrl
        - url
        - year
      properties:
        actors:
          type: array
          items:
            type: string
          example: ["Актер Первый", "Актер Второй"]
        audioTranslation:
          type: string
          example: "Профессиональный"
        category:
          type: string
          example: "Фильмы"
        description:
          type: string
          example: "Вымышленное описание для примера."
        director:
          type: string
          example: "Тестовый Режиссер"
        duration:
          type: string
          example: "01:45:00"
        files:
          type: array
          items:
            $ref: "#/components/schemas/TorrentFile"
        id:
          type: string
          example: "100001"
        imdbId:
          type: string
          example: "1234567"
        imdbUrl:
          type: string
          example: "https://www.imdb.com/title/tt1234567/"
        infoHash:
          type: string
          description: Uppercase info hash from the topic's magnet link, in that link's hex or base32 encoding, or an empty string when the topic has none
          example: "0123456789ABCDEF0123456789ABCDEF01234567"
        kinopoiskId:
          type: string
          example: "7654321"
        kinopoiskUrl:
          type: string
          example: "https://www.kinopoisk.ru/film/7654321/"
        magnetUri:
          type: string
          example: "magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567"
        name:
          type: string
          example: "Пример Фильма / Example Movie (2026) BDRip 1080p"
        posterUrl:
          type: string
          example: "https://example.com/poster.jpg"
        releaseCountry:
          type: string
          example: "Примерная Страна"
        torrentUrl:
          type: string
          example: "https://rutracker.org/forum/dl.php?t=100001"
        url:
          type: string
          example: "https://rutracker.org/forum/viewtopic.php?t=100001"
        year:
          type: string
          example: "2026"

    TorrentFile:
      type: object
      description: Individual file within a torrent release
      required:
        - name
        - size
      properties:
        name:
          type: string
          example: "sample.movie.2026.1080p.mkv"
        size:
          type: string
          example: "1.45 GB"
        sizeBytes:
          type: integer
          example: 1556925645

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional API key passed via HTTP header
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: Optional API key passed via query parameter
    BearerAuth:
      type: http
      scheme: bearer
      description: Optional API key passed as a Bearer token
    JackettApiKeyQuery:
      type: apiKey
      in: query
      name: jackett_apikey
      description: Optional API key passed via query parameter, as in the download links that search results and feeds contain
    PasskeyQuery:
      type: apiKey
      in: query
      name: passkey
      description: Optional API key passed via query parameter, an alternative name Jackett also accepts
    SessionCookie:
      type: apiKey
      in: cookie
      name: torrgate_session
      description: Optional signed session cookie set by the web client sign-in form
